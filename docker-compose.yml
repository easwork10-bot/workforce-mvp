# Docker Compose for local development
# Postgres + Redis with AOF persistence for session durability

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/workforce
      - REDIS_URL=redis://redis:6379
      - JWT_PUBLIC_KEY_FILE=/run/secrets/jwt_public_key
      - JWT_PRIVATE_KEY_FILE=/run/secrets/jwt_private_key
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ".:/app"
      - "/app/node_modules"
    secrets:
      - jwt_public_key
      - jwt_private_key

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=workforce
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - "redisdata:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:

secrets:
  jwt_public_key:
    file: ~/.config/ai/secrets/workforce-mvp/jwt_public_key.pem
  jwt_private_key:
    file: ~/.config/ai/secrets/workforce-mvp/jwt_private_key.pem
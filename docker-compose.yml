# Docker Compose for local development
# Postgres + Redis with AOF persistence for session durability

services:
  app:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:${WORKFORCE_DEV_APP_PORT:-3000}:3000"
    working_dir: /app
    init: true
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      DATABASE_URL: postgresql://postgres:${WORKFORCE_DEV_DB_PASSWORD:?Set WORKFORCE_DEV_DB_PASSWORD}@db:5432/workforce
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_B64: ""
      JWT_PRIVATE_KEY_B64: ""
      CSRF_SECRET: ${CSRF_SECRET:?Set CSRF_SECRET to a random value of at least 32 bytes}
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ".:/app"
      - "/app/node_modules"
      - "/app/.next"
    secrets:
      - jwt_public_key
      - jwt_private_key

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=workforce
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${WORKFORCE_DEV_DB_PASSWORD:?Set WORKFORCE_DEV_DB_PASSWORD}
    ports:
      - "127.0.0.1:${WORKFORCE_DEV_POSTGRES_PORT:-5433}:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:${WORKFORCE_DEV_REDIS_PORT:-6380}:6379"
    volumes:
      - "redisdata:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:

secrets:
  jwt_public_key:
    file: ${WORKFORCE_SECRETS_DIR:-./secrets}/jwt_public_key.pem
  jwt_private_key:
    file: ${WORKFORCE_SECRETS_DIR:-./secrets}/jwt_private_key.pem
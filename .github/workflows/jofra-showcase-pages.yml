name: Build and publish Jofra Pages

on:
  push:
    branches:
      - jofra-showcase
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jofra-showcase-pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Frontend import-boundary check
        run: npm run check:frontend-boundaries

      - name: Build Workforce application
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/workforce
          REDIS_URL: redis://127.0.0.1:1
          CSRF_SECRET: ci-only-not-a-runtime-secret-000000000000

  build-pages:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static Jofra pages
        run: npm run build:jofra-pages
        env:
          NEXT_PUBLIC_BASE_PATH: /workforce-mvp
          NEXT_PUBLIC_APP_URL: https://easwork10-bot.github.io

      - name: Verify static export routes and assets
        run: node scripts/verify-jofra-pages-export.mjs out
        env:
          NEXT_PUBLIC_BASE_PATH: /workforce-mvp

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/jofra-showcase'
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

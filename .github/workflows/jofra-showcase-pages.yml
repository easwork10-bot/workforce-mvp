name: Publish Jofra landing showcase

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jofra-showcase-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out showcase source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Copy public Jofra images
        run: mkdir -p showcase/public/jofra/assets && cp public/jofra/assets/* showcase/public/jofra/assets/

      - name: Build static landing pages
        run: npx next build showcase
        env:
          NEXT_PUBLIC_BASE_PATH: /workforce-mvp

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
